name: 'Claude Code Security Reviewer'
description: 'AI-powered security review GitHub Action using Claude to analyze code changes for security vulnerabilities'
author: 'Anthropic'

inputs:
  comment-pr:
    description: 'Whether to comment on PRs with findings'
    required: false
    default: 'true'
  
  upload-results:
    description: 'Whether to upload results as artifacts'
    required: false
    default: 'true'
  
  artifact-name:
    description: 'Artifact name; use a distinct name for each backend attempt in a job'
    required: false
    default: 'security-review-results'

  exclude-directories:
    description: 'Comma-separated list of directories to exclude from scanning'
    required: false
    default: ''

  claudecode-timeout:
    description: 'Timeout for ClaudeCode analysis in minutes'
    required: false
    default: '20'
  
  claude-api-key:
    description: 'Anthropic Claude API key for security analysis'
    required: true
    default: ''

  claude-model:
    description: 'Claude model to use for security analysis (e.g., claude-sonnet-4-20250514)'
    required: false
    default: ''

  run-every-commit:
    description: 'Run ClaudeCode on every commit (skips cache check). Warning: This may lead to more false positives on PRs with many commits as the AI analyzes the same code multiple times.'
    required: false
    default: 'false'

  false-positive-filtering-instructions:
    description: 'Path to custom false positive filtering instructions text file'
    required: false
    default: ''

  custom-security-scan-instructions:
    description: 'Path to custom security scan instructions text file to append to audit prompt'
    required: false
    default: ''

  effort:
    description: 'Claude Code effort level (low, medium, high, xhigh, max). Controls agent analysis depth and speed.'
    required: false
    default: ''

outputs:
  findings-count:
    description: 'Number of security findings'
    value: ${{ steps.claudecode-scan.outputs.findings_count }}
  
  results-file:
    description: 'Path to the results JSON file'
    value: ${{ steps.claudecode-scan.outputs.results_file }}

runs:
  using: 'composite'
  steps:
    - name: Install GitHub CLI
      shell: bash
      run: |
        echo "::group::Install gh CLI"
        # Install GitHub CLI for PR operations
        sudo apt-get update && sudo apt-get install -y gh
        echo "::endgroup::"
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 pinned to commit hash
      with:
        python-version: '3.x'
    
    - name: Check ClaudeCode run history
      id: claudecode-history
      if: github.event_name == 'pull_request'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 pinned to commit hash
      with:
        path: .claudecode-marker
        key: claudecode-${{ github.repository_id }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        restore-keys: |
          claudecode-${{ github.repository_id }}-pr-${{ github.event.pull_request.number }}-
    
    - name: Determine ClaudeCode enablement
      id: claudecode-check
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_EVERY_COMMIT: ${{ inputs.run-every-commit }}
      run: |
        # Check if ClaudeCode should be enabled
        ENABLE_CLAUDECODE="true"
        SILENCE_CLAUDECODE_COMMENTS="false"
        
        # For PRs, check sampling and cache
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          PR_NUMBER="$PR_NUMBER"
          CACHE_HIT="${{ steps.claudecode-history.outputs.cache-hit }}"

          # Now check cache - if ClaudeCode has already run, disable unless run-every-commit is true
          # Check if marker file exists (cache may have been restored from a different SHA)
          COMPLETED_SCAN=false
          if [ -f ".claudecode-marker/marker.json" ] && python -I -c 'import json, sys; sys.exit(json.load(open(".claudecode-marker/marker.json")).get("status") != "completed")' 2>/dev/null; then
            COMPLETED_SCAN=true
          fi
          if [ "$RUN_EVERY_COMMIT" != "true" ] && [ "$COMPLETED_SCAN" = "true" ]; then
            echo "ClaudeCode has already run on PR #$PR_NUMBER (found marker file), forcing disable to avoid false positives"
            ENABLE_CLAUDECODE="false"
          elif [ "$RUN_EVERY_COMMIT" == "true" ] && [ -f ".claudecode-marker/marker.json" ]; then
            echo "ClaudeCode has already run on PR #$PR_NUMBER but run-every-commit is enabled, running again"
          elif [ "$ENABLE_CLAUDECODE" == "true" ]; then
            echo "ClaudeCode will run for PR #$PR_NUMBER (first run)"
          fi
        fi
        
        echo "enable_claudecode=$ENABLE_CLAUDECODE" >> $GITHUB_OUTPUT
        echo "silence_claudecode_comments=$SILENCE_CLAUDECODE_COMMENTS" >> $GITHUB_OUTPUT
        
        if [ "$ENABLE_CLAUDECODE" == "true" ]; then
          echo "ClaudeCode is enabled for this run"
        else
          echo "ClaudeCode is disabled for this run"
        fi
    
    - name: Set up Node.js
      if: steps.claudecode-check.outputs.enable_claudecode == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned to commit hash
      with:
        node-version: '18'

    - name: Prepare dependency cache keys
      id: dependency-cache-keys
      if: steps.claudecode-check.outputs.enable_claudecode == 'true'
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # Hash the action's requirements, not files from the caller's checkout.
        # Isolated Python avoids importing modules from the PR workspace.
        REQUIREMENTS_HASH=$(python -I -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$ACTION_PATH/claudecode/requirements.txt")
        PYTHON_VERSION=$(python -I -c 'import platform; print(platform.python_version())')
        PIP_VERSION=$(python -I -m pip --version | awk '{print $2}')
        NODE_VERSION=$(node --version)
        NPM_VERSION=$(npm --version)
        # Floating dependency constraints are unchanged. Refresh the immutable
        # cache weekly, with the previous compatible entry available as a seed.
        CACHE_WEEK=$(date -u +%G-W%V)
        PIP_PREFIX="claudecode-pip-v1-${RUNNER_OS}-${RUNNER_ARCH}-${PYTHON_VERSION}-${PIP_VERSION}-${REQUIREMENTS_HASH}-"
        NPM_PREFIX="claudecode-npm-v1-${RUNNER_OS}-${RUNNER_ARCH}-${NODE_VERSION}-${NPM_VERSION}-claude-code-"
        {
          echo "pip-prefix=$PIP_PREFIX"
          echo "pip-key=${PIP_PREFIX}${CACHE_WEEK}"
          echo "npm-prefix=$NPM_PREFIX"
          echo "npm-key=${NPM_PREFIX}${CACHE_WEEK}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore pip download cache
      id: pip-download-cache
      if: steps.claudecode-check.outputs.enable_claudecode == 'true' && steps.dependency-cache-keys.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/claudecode-dependencies/pip
        key: ${{ steps.dependency-cache-keys.outputs.pip-key }}
        restore-keys: ${{ steps.dependency-cache-keys.outputs.pip-prefix }}

    - name: Restore npm download cache
      id: npm-download-cache
      if: steps.claudecode-check.outputs.enable_claudecode == 'true' && steps.dependency-cache-keys.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # Cache package data only, not npm logs or authentication configuration.
        path: ${{ runner.temp }}/claudecode-dependencies/npm/_cacache
        key: ${{ steps.dependency-cache-keys.outputs.npm-key }}
        restore-keys: ${{ steps.dependency-cache-keys.outputs.npm-prefix }}

    - name: Install dependencies
      id: install-dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PIP_CACHE_DIR: ${{ runner.temp }}/claudecode-dependencies/pip
        npm_config_cache: ${{ runner.temp }}/claudecode-dependencies/npm
      run: |
        echo "::group::Install Deps"
        if [ "${{ steps.claudecode-check.outputs.enable_claudecode }}" == "true" ]; then
          pip install -r "$ACTION_PATH/claudecode/requirements.txt"
          npm install -g @anthropic-ai/claude-code
        fi
        sudo apt-get update && sudo apt-get install -y jq
        echo "::endgroup::"

    # Save immediately after a successful installation, before the scan. A scan
    # failure should not discard downloads; a cache failure must not block it.
    - name: Save pip download cache
      if: steps.claudecode-check.outputs.enable_claudecode == 'true' && steps.install-dependencies.outcome == 'success' && steps.pip-download-cache.outcome == 'success' && steps.pip-download-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/claudecode-dependencies/pip
        key: ${{ steps.dependency-cache-keys.outputs.pip-key }}

    - name: Save npm download cache
      if: steps.claudecode-check.outputs.enable_claudecode == 'true' && steps.install-dependencies.outcome == 'success' && steps.npm-download-cache.outcome == 'success' && steps.npm-download-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/claudecode-dependencies/npm/_cacache
        key: ${{ steps.dependency-cache-keys.outputs.npm-key }}

    - name: Run ClaudeCode scan
      id: claudecode-scan
      if: steps.claudecode-check.outputs.enable_claudecode == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ANTHROPIC_API_KEY: ${{ inputs.claude-api-key }}
        ENABLE_CLAUDE_FILTERING: 'true' 
        EXCLUDE_DIRECTORIES: ${{ inputs.exclude-directories }}
        FALSE_POSITIVE_FILTERING_INSTRUCTIONS: ${{ inputs.false-positive-filtering-instructions }}
        CUSTOM_SECURITY_SCAN_INSTRUCTIONS: ${{ inputs.custom-security-scan-instructions }}
        CLAUDE_MODEL: ${{ inputs.claude-model }}
        CLAUDECODE_TIMEOUT: ${{ inputs.claudecode-timeout }}
        CLAUDE_EFFORT: ${{ inputs.effort }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        echo "Running ClaudeCode AI security analysis..."
        echo "----------------------------------------"
        
        # Initialize outputs
        echo "results_file=claudecode/claudecode-results.json" >> $GITHUB_OUTPUT
        
        # Skip ClaudeCode if not a PR
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "ClaudeCode only runs on pull requests, skipping"
          exit 0
        fi
        
        # A fallback attempt must never publish findings from an earlier attempt.
        rm -f "$ACTION_PATH/findings.json" "$GITHUB_WORKSPACE/findings.json" \
          "$GITHUB_WORKSPACE/claudecode-results.json" "$GITHUB_WORKSPACE/claudecode-error.log"

        # Validate API key is provided
        if [ -z "$ANTHROPIC_API_KEY" ]; then
          echo "::error::ANTHROPIC_API_KEY is not set. Please provide the claude-api-key input to the action."
          echo "Example usage:"
          echo "  - uses: anthropics/claude-code-security-reviewer@main"
          echo "    with:"
          echo "      claude-api-key: \$\{{ secrets.ANTHROPIC_API_KEY }}"
          exit 1
        fi
                
        # Set timeout
        export CLAUDE_TIMEOUT="$CLAUDECODE_TIMEOUT"
        
        # Run ClaudeCode audit with verbose debugging
        export REPO_PATH="${REPO_PATH:-$(pwd)}"
        cd "$ACTION_PATH"
        
        # Enable verbose debugging
        echo "::group::ClaudeCode Environment"
        echo "Current directory: $(pwd)"
        echo "Python version: $(python --version)"
        echo "Claude CLI version: $(claude --version 2>&1 || echo 'Claude CLI not found')"
        echo "ANTHROPIC_API_KEY set: $(if [ -n "$ANTHROPIC_API_KEY" ]; then echo 'Yes'; else echo 'No'; fi)"
        echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
        echo "PR_NUMBER: $PR_NUMBER"
        echo "Python path: $PYTHONPATH"
        echo "Files in claudecode directory:"
        ls -la claudecode/
        echo "::endgroup::"
        
        echo "::group::ClaudeCode Execution"
        # Add current directory to Python path so it can find the claudecode module
        export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}$(pwd)"
        echo "Updated PYTHONPATH: $PYTHONPATH"
        
        # A completed audit exits zero even when it reports vulnerabilities.
        CLAUDECODE_EXIT_CODE=0
        python -u claudecode/github_action_audit.py > claudecode/claudecode-results.json 2>claudecode/claudecode-error.log || CLAUDECODE_EXIT_CODE=$?

        if [ "$CLAUDECODE_EXIT_CODE" -ne 0 ]; then
          echo "::error::ClaudeCode audit failed with exit code $CLAUDECODE_EXIT_CODE. See the scan artifacts for diagnostics."
        elif ! jq -e -s 'length == 1 and (.[0] | type == "object" and (has("error") | not) and (.findings | type == "array" and all(.[]; type == "object")))' claudecode/claudecode-results.json > /dev/null 2>&1; then
          echo "::error::ClaudeCode returned an error or invalid results; expected one object with a findings array."
          CLAUDECODE_EXIT_CODE=1
        else
          jq '.findings' claudecode/claudecode-results.json > findings.json
          CLAUDECODE_FINDINGS_COUNT=$(jq 'length' findings.json)
          echo "findings_count=$CLAUDECODE_FINDINGS_COUNT" >> "$GITHUB_OUTPUT"
          echo "ClaudeCode scan completed with $CLAUDECODE_FINDINGS_COUNT security findings"
        fi

        # Preserve diagnostics before failing so always() artifact upload still runs.
        if [ -f findings.json ] && ! [ findings.json -ef "$GITHUB_WORKSPACE/findings.json" ]; then
          cp findings.json "$GITHUB_WORKSPACE/findings.json"
        fi
        for file in claudecode-results.json claudecode-error.log; do
          if [ -f "claudecode/$file" ]; then
            cp "claudecode/$file" "$GITHUB_WORKSPACE/$file"
          fi
        done
        echo "::endgroup::"
        exit "$CLAUDECODE_EXIT_CODE"

    - name: Record completed ClaudeCode scan
      if: steps.claudecode-scan.outcome == 'success' && github.event_name == 'pull_request'
      shell: bash
      env:
        REPOSITORY_ID: ${{ github.repository_id }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        # Cache only completed scans; a failed primary must not suppress the fallback.
        mkdir -p .claudecode-marker
        cat > .claudecode-marker/marker.json << EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "repository_id": "$REPOSITORY_ID",
          "repository": "$REPOSITORY",
          "pr_number": $PR_NUMBER,
          "sha": "$SHA",
          "status": "completed",
          "run_id": "$RUN_ID",
          "run_number": "$RUN_NUMBER"
        }
        EOF
        echo "Created ClaudeCode completion marker for PR #$PR_NUMBER"

    - name: Save completed ClaudeCode scan to cache
      if: steps.claudecode-scan.outcome == 'success' && github.event_name == 'pull_request'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 pinned to commit hash
      with:
        path: .claudecode-marker
        key: claudecode-${{ github.repository_id }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
    
    - name: Upload scan results
      if: always() && inputs.upload-results == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 pinned to commit hash
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          findings.json
          claudecode-results.json
          claudecode-error.log
        retention-days: 7
        if-no-files-found: ignore
    
    - name: Comment PR with findings
      if: github.event_name == 'pull_request' && inputs.comment-pr == 'true' && steps.claudecode-check.outputs.enable_claudecode == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CLAUDECODE_FINDINGS: ${{ steps.claudecode-scan.outputs.findings_count }}
        SILENCE_CLAUDECODE_COMMENTS: ${{ steps.claudecode-check.outputs.silence_claudecode_comments }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "$ACTION_PATH/scripts/comment-pr-findings.js"

branding:
  icon: 'shield'
  color: 'red'
